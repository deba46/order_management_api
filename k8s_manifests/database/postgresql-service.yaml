apiVersion: v1
kind: Service
metadata:
  name: orders-server-postgresql
  namespace: orders-api
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: orders-server
    app.kubernetes.io/component: primary
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: postgresql-12.12.10
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: orders-server
    app.kubernetes.io/component: primary
---
apiVersion: v1
kind: Service
metadata:
  name: orders-server-postgresql-hl
  namespace: orders-api
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: orders-server
    app.kubernetes.io/component: primary
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: postgresql-12.12.10
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: orders-server
    app.kubernetes.io/component: primary