# Default values for order-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/deba46/order-management-api
  pullPolicy: Always  # Use 'IfNotPresent' for local/loaded images
  tag: "47abe40"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: order-api.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: order-api-tls
      hosts:
        - order-api.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health check probes
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# PostgreSQL configuration
postgresql:
  host: "orders-server-postgresql.orders-api.svc.cluster.local"
  port: "5432"
  database: "server"
  username: "orders"
  # added a secret for passwrd
  password: ""

# Application settings
app:
  name: "Order Management API"
  version: "1.0.0"
